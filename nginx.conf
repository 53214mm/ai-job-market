server {
    listen 80;
    server_name _;

    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8123/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级支持（STOMP 私信需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Swagger / Knife4j API 文档
    location /api/swagger-ui.html {
        proxy_pass http://backend:8123/api/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /api/v3/api-docs {
        proxy_pass http://backend:8123/api/v3/api-docs;
        proxy_set_header Host $host;
    }
    location /api/doc.html {
        proxy_pass http://backend:8123/api/doc.html;
        proxy_set_header Host $host;
    }

    # WebSocket 原始端点（如果 STOMP 需要直接 ws:// 连接）
    location /api/ws {
        proxy_pass http://backend:8123/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # 静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 上传大小限制
    client_max_body_size 10M;
}
